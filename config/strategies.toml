# Strategy registry: the profitability gate's source of truth for live signals.
#
# Only strategies with status LIVE_SMALL or LIVE may emit live signals. A strategy that is missing
# from this file is treated as not approved (fail closed).
# Lifecycle: RESEARCH -> PAPER -> LIVE_SMALL -> LIVE. Strategies that fail go to DISABLED or REJECTED.
#
# Evidence is from the 2026-10-08 audit (reproduce: python -m trader.research.audit): India 5-minute
# bars, fill at next bar open, 1% stop / 2% target, intraday square-off, 0.1425% round-trip costs.
# "Random" means time-of-day-matched random entries with the same exits.

[R1]
name = "Volume Breakout"
status = "DISABLED"
evidence = "604 trades, 40.6% winners, -0.102%/trade net (t=-3.3), PF 0.71; no better than random (p=0.19). US 5m -0.137%, India 1h -0.159%."

[R2]
name = "Oversold Reversal"
status = "REJECTED"
evidence = "152 trades, 34.2% winners, -0.201%/trade net (t=-3.1), PF 0.54. US 5m -0.003%, India 1h -0.158%."

[R3]
name = "Overbought Breakdown"
status = "REJECTED"
evidence = "Never fired in ~272,000 bars: RSI>70 while closing below the 20-bar low is near-contradictory."

[R4]
name = "Turtle Trend Breakout"
status = "REJECTED"
evidence = "454 trades, 35.9% winners, -0.175%/trade net (t=-4.5), PF 0.60; 38.5% of its signals duplicate R1. US 5m -0.117%, India 1h -0.142%."

[R5]
name = "Tudor Jones Macro Filter"
status = "REJECTED"
evidence = "661 trades, 36.8% winners, -0.191%/trade net (t=-6.1), PF 0.56. US 5m -0.103%, India 1h -0.149%."

[R6]
name = "Minervini Momentum Stacking"
status = "REJECTED"
evidence = "356 trades, 40.2% winners, -0.117%/trade net (t=-2.7), PF 0.69; 33% of its signals duplicate R1. US 5m -0.172%, India 1h -0.126%."

[R7]
name = "Stat-Arb Mean Reversion"
status = "DISABLED"
evidence = "374 trades, 35.6% winners, -0.188%/trade net (t=-4.4), PF 0.57. Weak pre-cost edge on India 1h (p=0.03) but still -0.092% net; research candidate only."

[R8L]
name = "Crabel Intraday Expansion"
status = "REJECTED"
evidence = "1,234 trades, 39.0% winners, -0.152%/trade net (t=-6.6), PF 0.63. US 5m -0.062%, India 1h -0.144%."

[R8S]
name = "Crabel Intraday Breakdown"
status = "REJECTED"
evidence = "1,274 trades, 43.0% winners, -0.106%/trade net (t=-4.7), PF 0.72. US 5m -0.040%, India 1h -0.137%."

# Phase 3 swing hypotheses (docs/research/phase3-preregistration.md), judged on the 2022-2026 holdout
# in docs/research/phase3-results.md. Reproduce: python -m trader.research.phase3

[H1]
name = "Swing: oversold pullback in an uptrend, NIFTY 50 stocks"
status = "REJECTED"
evidence = "1,771 holdout trades, 60.2% winners but -0.050%/trade net (t=-0.67), PF 0.96, avg loss 1.6x avg win. Beat random entries before costs (p=0.04, Holm 0.12), but 0.30% delivery costs exceed that edge."

[H2]
name = "Swing: oversold pullback in an uptrend, NIFTY 50 index via ETF"
status = "REJECTED"
evidence = "46 holdout trades, 63.0% winners, +0.122%/trade net (t=0.60), PF 1.26; lost money 2016-2021; no better than random entry days (Holm p=0.31)."

[H3]
name = "Swing: 12-1 month momentum, top 5 NIFTY 50 stocks"
status = "REJECTED"
evidence = "280 holdout trades, 55.7% winners, +1.18%/trade net (t=2.12), PF 1.40, but 5 random picks from the same list did nearly as well (Holm p=0.31): the profit is the survivorship-biased list's drift, not momentum."

# Research round 2 (docs/research/round2-preregistration.md): the H1 rules unchanged on new markets,
# judged on the 2022-2026 holdout in docs/research/round2-results.md. Reproduce: python -m trader.research.round2

[H4]
name = "Swing: oversold pullback in an uptrend, US large caps"
status = "REJECTED"
evidence = "2,607 holdout trades on 82 S&P 100 stocks, 62.0% winners, +0.162%/trade net, PF 1.14; random entry days in the same stocks made most of it (p=0.22, Holm 0.43); cluster-robust t 1.40; earnings gaps reached -3.4R."

[H5]
name = "Swing: oversold pullback in an uptrend, Indian index ETFs"
status = "REJECTED"
evidence = "143 holdout trades on NIFTY BANK/IT/PHARMA/NEXT 50, 54.5% winners, -0.057%/trade net (t=-0.34), PF 0.93: the design period's +0.31%/trade did not hold up after 2021."

[H6]
name = "Swing: oversold pullback in an uptrend, US sector ETFs"
status = "REJECTED"
evidence = "431 holdout trades on the 11 sector SPDRs, 65.2% winners, +0.243%/trade net (t=2.40), PF 1.37, 9 of 11 years positive, but not clearly better than random entry days (p=0.069, Holm 0.21; cluster-robust t 1.86). The strongest lead so far; needs fresh data, not a re-test."

# Research round 3 (docs/research/round3-preregistration.md): confirming or retiring H6 on unseen data;
# both tests had to pass. Results: docs/research/round3-results.md. Reproduce: python -m trader.research.round3
# H6 was not confirmed, so the pullback rules (H1, H2, H4-H8) are retired: no variant of them is tested again.

[H7]
name = "Swing: oversold pullback in an uptrend, US sector SPDRs 2000-2015"
status = "REJECTED"
evidence = "1,085 trades, 71.1% winners, +0.323%/trade net (t=5.30, cluster-robust 3.48), PF 1.56, beat random entry days (Holm p=0.012); failed the loss-size limit (avg loss 1.57x avg win, limit 1.5x) and needed H8 to pass too."

[H8]
name = "Swing: oversold pullback in an uptrend, iShares country ETFs 2016-2026"
status = "REJECTED"
evidence = "1,154 trades on 15 country ETFs, 61.6% winners, +0.072%/trade net (t=1.16, cluster-robust 0.76), PF 1.10, no better than random entry days (Holm p=0.19): the effect did not carry over."

# Research round 4 (docs/research/round4-preregistration.md): the turn-of-the-month effect, judged on each
# whole span in docs/research/round4-results.md. Reproduce: python -m trader.research.round4

[H9]
name = "Swing: turn of the month, S&P 500 (SPY)"
status = "REJECTED"
evidence = "404 trades 1993-2026, 57.7% winners, +0.229%/trade net (t=2.26), PF 1.34, both halves positive, but not clearly better than random 4-day holds (p=0.067) and only 61% of years positive (needs 70%)."

[H10]
name = "Swing: turn of the month, NIFTY 50 via NIFTYBEES"
status = "REJECTED"
evidence = "225 trades 2008-2026, 56.4% winners, +0.277%/trade net, PF 1.34; beat random 4-day holds (+0.38% vs +0.03% gross, Holm p=0.033) but too few trades to be sure it is positive (t=1.65, needs 2.0) and only 61% of years positive; 2024-2026 slightly negative."

# Research round 5 (docs/research/round5-preregistration.md): a batch of documented monthly effects,
# judged on each whole span in docs/research/round5-results.md. Reproduce: python -m trader.research.round5

[H11]
name = "Swing: turn of the month, Indian indices beyond the NIFTY 50 (via BANKBEES, JUNIORBEES, ITBEES, PHARMABEES)"
status = "REJECTED"
evidence = "863 trades 2008-2026, 57.9% winners, +0.475%/trade net (t=4.82), PF 1.57, far above random 4-day holds (Holm p<0.001); failed only 'each third profitable' (2014-2020 flat at -0.02%), and lost money in each of 2024, 2025 and 2026."

[H12]
name = "Swing: turn of the month, 15 country ETFs"
status = "REJECTED"
evidence = "4,334 trades 2001-2026, 54.9% winners, +0.265%/trade net (t=5.85), beat random 4-day holds (Holm p=0.039), all 15 countries profitable; failed only the profit factor (1.27, needs 1.3)."

[H13]
name = "Swing: momentum, top 3 of the 9 US sector SPDRs monthly"
status = "REJECTED"
evidence = "960 trades 2000-2026, +0.858%/trade net, but three random sectors a month did nearly as well (+0.82% vs +0.90% gross, p=0.20): the profit is market drift, not momentum."

[H14]
name = "Swing: momentum, top 3 of 15 country ETFs monthly"
status = "REJECTED"
evidence = "924 trades 2001-2026, +0.803%/trade net, but three random countries a month did nearly as well (+0.80% vs +0.91% gross, p=0.18): market drift, not momentum."

# Research round 6 (docs/research/round6-preregistration.md): six strategies from Ernest Chan's Algorithmic
# Trading (2013), judged on 2013-07-01 to 2026-10-08, after the book appeared, in
# docs/research/round6-results.md. Reproduce: python -m trader.research.round6

[C1]
name = "Intraday: buy-on-gap, NIFTY 50 stocks"
status = "REJECTED"
evidence = "111 trades 2015-2026, 54.1% winners, +0.154%/trade net (t=0.73), PF 1.19; beat random days before correction (p=0.015) but not after it (Holm p=0.087), and lost money in 2024 and 2025."

[C2]
name = "Intraday: buy-on-gap, 82 S&P 100 stocks"
status = "REJECTED"
evidence = "355 trades 2015-2026, 51.0% winners, +0.007%/trade net (t=0.06), PF 1.01: flat, profitable in the first half and losing in the second, no better than random days (p=0.17)."

[C3]
name = "Intraday: opening-gap momentum, NIFTY 50 index"
status = "REJECTED"
evidence = "1,055 trades 2013-2026, 40.9% winners, -0.159%/trade net (t=-6.41): loses before costs too (-0.040% gross); NIFTY's gaps faded during the day instead of continuing."

[C4]
name = "Intraday: opening-gap momentum, SPY"
status = "REJECTED"
evidence = "1,066 trades 2013-2026, 47.9% winners, -0.056%/trade net (t=-2.34): loses before costs too (-0.013% gross), the short side most."

[C5]
name = "Monthly: time-series momentum, NIFTY 50 or cash"
status = "REJECTED"
evidence = "127 invested months 2013-2026, 55.1% winners, +0.505%/month net (t=1.30); invested months earned less than random months (p=0.86). CAGR 5.2% against 10.9% bought and held, with no smaller drawdown."

[C6]
name = "Monthly: time-series momentum, SPY or T-bills"
status = "REJECTED"
evidence = "141 invested months 2013-2026, 70.2% winners, +0.997%/month net (t=3.01), PF 1.94, but no better than random months (p=0.70): market drift. CAGR 10.6% against 14.0% bought and held, at the same drawdown."

# Research round 7 (docs/research/round7-preregistration.md, pinned 13 Oct 2026): market intraday momentum in
# NIFTYBEES on the frozen Kite 1-minute bars, run once at commit 0e604d1; docs/research/round7-results.md.
# Reproduce (without writing): pytest -m slow tests/research/test_round7_regression.py

[I1]
name = "Intraday: buy NIFTYBEES 14:45-15:14 after a rising morning"
status = "REJECTED"
evidence = "959 trades 2020-2026, 24.4% winners, -0.111%/trade net (t=-16.8); +0.0097% gross against +0.0083% for the same window on random days (p=0.42): the morning adds nothing, and 0.12% costs make it lose."

[I2]
name = "Intraday: short NIFTYBEES 14:45-15:14 after a falling morning"
status = "REJECTED"
evidence = "714 trades 2020-2026, 23.5% winners, -0.128%/trade net (t=-15.4); -0.0079% gross against -0.0065% on random days (p=0.56): no edge before costs."

[I3]
name = "Intraday: NIFTYBEES 14:45-15:14 in the direction of a big morning"
status = "REJECTED"
evidence = "279 trades 2021-2026, 26.9% winners, -0.123%/trade net (t=-9.6); -0.0024% gross against +0.0004% on random days (p=0.60): even big mornings carry no edge."

