# Strategy registry: the profitability gate's source of truth for live signals.
#
# Only strategies with status LIVE_SMALL or LIVE may emit live signals. A strategy that is missing
# from this file is treated as not approved (fail closed).
# Lifecycle: RESEARCH -> PAPER -> LIVE_SMALL -> LIVE. Strategies that fail go to DISABLED or REJECTED.
#
# Evidence is from the 2026-10-08 audit (reproduce: python -m trader.research.audit): India 5-minute
# bars, fill at next bar open, 1% stop / 2% target, intraday square-off, 0.1425% round-trip costs.
# "Random" means time-of-day-matched random entries with the same exits.

[R1]
name = "Volume Breakout"
status = "DISABLED"
evidence = "604 trades, 40.6% winners, -0.102%/trade net (t=-3.3), PF 0.71; no better than random (p=0.19). US 5m -0.137%, India 1h -0.159%."

[R2]
name = "Oversold Reversal"
status = "REJECTED"
evidence = "152 trades, 34.2% winners, -0.201%/trade net (t=-3.1), PF 0.54. US 5m -0.003%, India 1h -0.158%."

[R3]
name = "Overbought Breakdown"
status = "REJECTED"
evidence = "Never fired in ~272,000 bars: RSI>70 while closing below the 20-bar low is near-contradictory."

[R4]
name = "Turtle Trend Breakout"
status = "REJECTED"
evidence = "454 trades, 35.9% winners, -0.175%/trade net (t=-4.5), PF 0.60; 38.5% of its signals duplicate R1. US 5m -0.117%, India 1h -0.142%."

[R5]
name = "Tudor Jones Macro Filter"
status = "REJECTED"
evidence = "661 trades, 36.8% winners, -0.191%/trade net (t=-6.1), PF 0.56. US 5m -0.103%, India 1h -0.149%."

[R6]
name = "Minervini Momentum Stacking"
status = "REJECTED"
evidence = "356 trades, 40.2% winners, -0.117%/trade net (t=-2.7), PF 0.69; 33% of its signals duplicate R1. US 5m -0.172%, India 1h -0.126%."

[R7]
name = "Stat-Arb Mean Reversion"
status = "DISABLED"
evidence = "374 trades, 35.6% winners, -0.188%/trade net (t=-4.4), PF 0.57. Weak pre-cost edge on India 1h (p=0.03) but still -0.092% net; research candidate only."

[R8L]
name = "Crabel Intraday Expansion"
status = "REJECTED"
evidence = "1,234 trades, 39.0% winners, -0.152%/trade net (t=-6.6), PF 0.63. US 5m -0.062%, India 1h -0.144%."

[R8S]
name = "Crabel Intraday Breakdown"
status = "REJECTED"
evidence = "1,274 trades, 43.0% winners, -0.106%/trade net (t=-4.7), PF 0.72. US 5m -0.040%, India 1h -0.137%."

# Phase 3 swing hypotheses (docs/research/phase3-preregistration.md), judged on the 2022-2026 holdout
# in docs/research/phase3-results.md. Reproduce: python -m trader.research.phase3

[H1]
name = "Swing: oversold pullback in an uptrend, NIFTY 50 stocks"
status = "REJECTED"
evidence = "1,771 holdout trades, 60.2% winners but -0.050%/trade net (t=-0.67), PF 0.96, avg loss 1.6x avg win. Beat random entries before costs (p=0.04, Holm 0.12), but 0.30% delivery costs exceed that edge."

[H2]
name = "Swing: oversold pullback in an uptrend, NIFTY 50 index via ETF"
status = "REJECTED"
evidence = "46 holdout trades, 63.0% winners, +0.122%/trade net (t=0.60), PF 1.26; lost money 2016-2021; no better than random entry days (Holm p=0.31)."

[H3]
name = "Swing: 12-1 month momentum, top 5 NIFTY 50 stocks"
status = "REJECTED"
evidence = "280 holdout trades, 55.7% winners, +1.18%/trade net (t=2.12), PF 1.40, but 5 random picks from the same list did nearly as well (Holm p=0.31): the profit is the survivorship-biased list's drift, not momentum."

# Research round 2 (docs/research/round2-preregistration.md): the H1 rules unchanged on new markets,
# judged on the 2022-2026 holdout in docs/research/round2-results.md. Reproduce: python -m trader.research.round2

[H4]
name = "Swing: oversold pullback in an uptrend, US large caps"
status = "REJECTED"
evidence = "2,607 holdout trades on 82 S&P 100 stocks, 62.0% winners, +0.162%/trade net, PF 1.14; random entry days in the same stocks made most of it (p=0.22, Holm 0.43); cluster-robust t 1.40; earnings gaps reached -3.4R."

[H5]
name = "Swing: oversold pullback in an uptrend, Indian index ETFs"
status = "REJECTED"
evidence = "143 holdout trades on NIFTY BANK/IT/PHARMA/NEXT 50, 54.5% winners, -0.057%/trade net (t=-0.34), PF 0.93: the design period's +0.31%/trade did not hold up after 2021."

[H6]
name = "Swing: oversold pullback in an uptrend, US sector ETFs"
status = "REJECTED"
evidence = "431 holdout trades on the 11 sector SPDRs, 65.2% winners, +0.243%/trade net (t=2.40), PF 1.37, 9 of 11 years positive, but not clearly better than random entry days (p=0.069, Holm 0.21; cluster-robust t 1.86). The strongest lead so far; needs fresh data, not a re-test."
