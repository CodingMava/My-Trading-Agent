# Strategy registry: the profitability gate's source of truth for live signals.
#
# Only strategies with status LIVE_SMALL or LIVE may emit live signals. A strategy that is missing
# from this file is treated as not approved (fail closed).
# Lifecycle: RESEARCH -> PAPER -> LIVE_SMALL -> LIVE. Strategies that fail go to DISABLED or REJECTED.
#
# Evidence is from the 2026-10-08 audit (reproduce: python -m trader.research.audit): India 5-minute
# bars, fill at next bar open, 1% stop / 2% target, intraday square-off, 0.1425% round-trip costs.
# "Random" means time-of-day-matched random entries with the same exits.

