# Exchange trading calendars.
#
# Holidays must come from the exchange's official list. Update this file every December when the
# next year's list is published. A year missing from `years` is unknown: anything that needs the
# calendar for that year (the scanner, freshness checks) fails closed, i.e. NO TRADE.
#
# Format: holidays "YYYY-MM-DD" = "name"; early_closes "YYYY-MM-DD" = "HH:MM";
# special_sessions "YYYY-MM-DD" = ["HH:MM", "HH:MM"] for sessions on otherwise closed days.

[NSE]
timezone = "Asia/Kolkata"
open = "09:15"
close = "15:30"
years = [2026]
source = "NSE trading holidays 2026 (circular NSE/FAOP/71777, 12 Dec 2025) plus the one-off 15 Jan 2026 closure; dates up to 8 Oct 2026 checked against NIFTY 50 trading days. The Sunday 1 Feb 2026 Budget session, missing from Yahoo's data (so that check missed it), was added on 13 Oct 2026 from Kite's minute bars and NSE's notice."

[NSE.holidays]
# Weekday closures only. Weekend holidays in 2026 (no effect on trading): 15 Feb Mahashivratri,
# 21 Mar Id-Ul-Fitr, 15 Aug Independence Day, 8 Nov Diwali Laxmi Pujan.
"2026-01-15" = "Municipal elections in Maharashtra (one-off closure)"
"2026-01-26" = "Republic Day"
"2026-03-03" = "Holi"
"2026-03-26" = "Shri Ram Navami"
"2026-03-31" = "Shri Mahavir Jayanti"
"2026-04-03" = "Good Friday"
"2026-04-14" = "Dr. Baba Saheb Ambedkar Jayanti"
"2026-05-01" = "Maharashtra Day"
"2026-05-28" = "Bakri Id"
"2026-06-26" = "Muharram"
"2026-09-14" = "Ganesh Chaturthi"
"2026-10-02" = "Mahatma Gandhi Jayanti"
"2026-10-20" = "Dussehra"
"2026-11-10" = "Diwali Balipratipada"
"2026-11-24" = "Prakash Gurpurb Sri Guru Nanak Dev"
"2026-12-25" = "Christmas"

[NSE.special_sessions]
"2026-02-01" = ["09:15", "15:30"]  # Union Budget day, a Sunday: a full live session
# Muhurat trading on Sunday 8 Nov 2026: add it here once NSE announces the session's hours.

