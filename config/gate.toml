# The profitability gate: the evidence a strategy needs before it may paper trade (PAPER) or trade
# real money (LIVE_SMALL, then LIVE). The registry enforces it when it loads: a strategy can only
# hold the status its evidence (docs/research/evidence/) supports.

[research]
# Backtest criteria, judged on the holdout period, net of base costs unless stated.
min_trades = 50
min_win_rate = 0.50          # the "not mostly losing" floor
min_profit_factor = 1.3
min_t_stat = 2.0
max_p_value = 0.05           # beating the random baseline, after Holm correction
cost_stress = 1.5            # expectancy must stay positive with costs this many times higher
max_loss_to_win = 1.5        # average loss at most this multiple of the average win
worst_trade_r = -3.0         # with a stop: no trade worse than this many R
min_positive_years = 0.70    # share of calendar years (with min_trades_per_year trades) in profit
min_trades_per_year = 10
min_breadth = 0.60           # stock strategies: share of stocks (with min_trades_per_stock trades) in profit
min_trades_per_stock = 5
max_drawdown_r = 20          # the backtest's deepest drawdown, in R: no deeper than the decay rule's limit (and at
                             # 0.5% risk per trade, the kill switch's 10%). Confirmed 13 Oct 2026; evidence without it
                             # can't support PAPER

[paper]
# Paper-trading criteria before LIVE_SMALL: the audit's Level 5.
min_weeks = 13               # at least three months
min_trades = 40
max_cost_ratio = 1.5         # realised costs at most this multiple of the modelled costs
min_clean_sessions = 60      # unattended sessions in a row without a failed run
min_reviewed_trades = 20     # paper trades a person has reviewed and agreed with (python -m trader.execution.report --reviewed N)
# The paper expectancy must also sit inside the research holdout's 95% confidence interval, no duplicate
# order may have been attempted, and the records must reconcile.

[live]
# Small live capital before LIVE (the audit's Level 6): python -m trader.execution.report --live.
min_weeks = 13               # at least three months
min_round_trips = 10
min_fill_rate = 0.95         # of the paper orders since live trading began, the share that filled live too
max_tracking_gap = 0.005     # live expectancy per trade within this of paper's, either way
max_cost_ratio = 1.5         # live slippage against paper at most this multiple of the model's
bad_week = 0.01              # a losing week of at least this share of the live capital must have been survived
# Also: no live request refused or left unresolved, and a person confirms the kill switch was tested live
# and that they never overrode the system (--kill-switch-tested --no-overrides).
# Scaling the capital (Level 7), enforced by the live jobs:
max_step_increase = 2.0      # each increase of [live] capital at most doubles the current step
min_step_weeks = 4           # weeks between increases
max_step_drawdown = 0.10     # a step losing more than this from its peak reverts to the previous size; the
                             # audit's rule uses the backtested maximum, which the evidence doesn't record

[evidence]
max_age_days = 365           # older evidence no longer supports PAPER or LIVE statuses

[decay]
# Watching paper and live trades.
window = 50                  # most recent trades considered
max_win_rate_drop = 0.15     # rolling win rate this far below research: demote
max_drawdown_r = 20          # drawdown (in R) beyond this since trading began: disable
