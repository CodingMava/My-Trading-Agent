# Non-secret runtime settings. Secrets (tokens, API keys) belong in .env, never in this file.

[data]
# Where the daily run gets bars: "yahoo" (free, unofficial; fine for research) or "kite" (Zerodha Kite
# Connect: needs KITE_API_KEY / KITE_API_SECRET in .env and a daily `python -m trader.data.kite login`).
provider = "yahoo"

[paper]
# End-of-day paper trading (python -m trader.execution.eod). Pretend money only.
starting_capital = 1000000          # rupees
database = "state/paper.db"         # git-ignored
send_no_trade_messages = false      # Telegram a NO TRADE message for every refused signal (they're always logged)

[live]
# Real orders through Zerodha Kite (Phase 11; python -m trader.execution.live). They go out only for
# strategies whose status is LIVE_SMALL or LIVE on paper-trading evidence, and only once this is on.
# Read docs/runbook.md, "Before the first real order", first.
enabled = false
capital = 0                         # rupees for the live strategies; each paper order is scaled by capital / paper capital
database = "state/live.db"          # git-ignored
max_orders_per_day = 10             # new entries per day, at most
max_order_fraction = 0.25           # one entry's value at most this share of the live capital

[notifications]
# Telegram alerts go out only for strategies approved in config/strategies.toml, and only when
# TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are set in .env.
telegram_enabled = true
telegram_timeout_seconds = 10

[news]
# NSE's corporate announcements, collected for research every 15 minutes (python -m trader.research.news).
# Research only: no trading code reads them.
enabled = true
database = "state/news.db"         # git-ignored

[ai]
# Optional AI tags for the collected news (python -m trader.research.news tag-ai): research only. Needs a
# current GEMINI_API_KEY in .env (the old one leaked). AI never approves, sizes or places trades.
enabled = false
provider = "gemini"
model = "gemini-2.5-flash"
timeout_seconds = 20
