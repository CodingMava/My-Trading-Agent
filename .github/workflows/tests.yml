name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      # Fast tests only: no network, no market data. Includes the scan for committed secrets. The risk
      # gate and the order path must keep 100% branch coverage (pyproject.toml [tool.coverage]).
      - run: coverage run -m pytest
      - run: coverage report
